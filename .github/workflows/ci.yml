name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  dependencies:
    name: Rust dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit --deny warnings
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify locked dashboard assets
        run: |
          npm ci --ignore-scripts --prefix dashboard
          npm audit --prefix dashboard
          npm run build --prefix dashboard
          git diff --exit-code -- dashboard/assets
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Build
        run: cargo build --workspace --locked
      - name: Test
        run: cargo test --workspace --locked
      - name: Check isolated first-use demo
        run: python3 scripts/launch_demo.py --skip-build --check-only --port 18081
      - name: Verify committed source-reference bytes
        run: python3 reference/usgs-river-gauge/tools/verify.py --bundle reference/usgs-river-gauge/snapshot
      - name: Check seed script syntax
        run: bash -n seed_witness.sh
      - name: Dashboard request ordering regressions
        run: node --test dashboard/tests/*.test.cjs
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

[workspace]
resolver = "2"
members = [
    "core",
    "api",
    "ingestion",
]

[workspace.package]
license = "MPL-2.0"
repository = "https://github.com/seanebones-lang/witness"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
ed25519-dalek = "2.0"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1.7", features = ["v1", "v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx-core = { version = "=0.8.6", default-features = false, features = ["_rt-tokio", "migrate"] }
sqlx-sqlite = { version = "=0.8.6", default-features = false, features = ["bundled", "migrate"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4.5", features = ["derive", "env"] }
async-graphql = { version = "8.0.0-rc.5" }
async-graphql-axum = { version = "8.0.0-rc.5" }
csv = "1.3"
rand = "0.8"

[workspace.lints.rust]
edition2024 = "allow"
